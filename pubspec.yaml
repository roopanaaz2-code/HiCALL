name: hicall
description: HiCALL secure audio and video calling app.
publish_to: "none"
version: 1.0.0+1
environment:
  sdk: ">=3.13.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  material_ui: ^1.11.1
  supabase_flutter: ^2.10.3
  livekit_client: ^2.5.2
  image_picker: ^1.2.4
  permission_handler: ^12.0.1
  flutter_svg: ^2.2.1
  audioplayers: ^6.8.1
  file_picker: ^13.4.1
  path_provider: ^2.1.5
  wakelock_plus: ^1.8.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/hicall_icon.svg
    - assets/hicall_icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/hicall_icon.png
  adaptive_icon_background: "#070D22"
  adaptive_icon_foreground: assets/hicall_icon.png
