name: HiCALL Shorebird Patch

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Validate only first. Publishing is a separate explicit operation.
        required: true
        type: choice
        options:
          - validate
          - publish
        default: validate
      release_version:
        description: Installed Shorebird release version
        required: true
        type: string
        default: 1.0.0+1
      track:
        description: Shorebird patch track (used only when operation is publish)
        required: true
        type: choice
        options:
          - staging
          - stable
        default: staging

permissions:
  contents: read

concurrency:
  group: hicall-shorebird-${{ github.ref }}-${{ inputs.release_version }}-${{ inputs.operation }}-${{ inputs.track }}
  cancel-in-progress: false

jobs:
  validate:
    if: inputs.operation == 'validate'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Set up Flutter matching installed release
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.hicall --project-name hicall .

      - name: Render launcher icon source required by pubspec
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rsvg-convert --width 1024 --height 1024 assets/hicall_icon.svg > assets/hicall_icon.png

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze

      - name: Run available Flutter tests
        shell: bash
        run: |
          set -euo pipefail
          if [ -d test ] && find test -type f -name '*_test.dart' -print -quit | grep -q .; then
            flutter test
          else
            echo "No Flutter test files found; test step skipped."
          fi

      - name: Build Android debug APK (compile check only)
        run: flutter build apk --debug

  publish:
    if: inputs.operation == 'publish' && github.ref == 'refs/heads/feature/installed-release-clear-chat-background-contact'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      RELEASE_VERSION: ${{ inputs.release_version }}
      PATCH_TRACK: ${{ inputs.track }}
    steps:
      - name: Checkout installed-release feature branch
        uses: actions/checkout@v4

      - name: Verify Shorebird app, release version, and signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SHOREBIRD_TOKEN" || { echo "::error::SHOREBIRD_TOKEN is missing."; exit 1; }
          test -s shorebird.yaml || { echo "::error::shorebird.yaml is missing."; exit 1; }
          grep -Fq '6c6a7838-5335-4ffd-9a4e-3bf5cc7a6c08' shorebird.yaml || {
            echo "::error::This is not the installed HiCALL Shorebird app."; exit 1;
          }
          test "$RELEASE_VERSION" = "1.0.0+1" || {
            echo "::error::Only the installed 1.0.0+1 release is allowed by this workflow."; exit 1;
          }
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || {
            echo "::error::Persistent Android signing secrets are required."; exit 1;
          }

      - name: Set up Flutter matching the installed release
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true

      - name: Set up Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate Android platform files with Shorebird Flutter
        run: flutter create --platforms=android --org com.hicall --project-name hicall .

      - name: Configure persistent Android signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p android/app
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          chmod 600 android/key.properties android/app/upload-keystore.jks

      - name: Prepare Firebase, manifest, Gradle mirror, and signing
        run: python3 scripts/prepare_shorebird_android.py

      - name: Render launcher icon source
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rsvg-convert --width 1024 --height 1024 assets/hicall_icon.svg > assets/hicall_icon.png

      - name: Resolve packages
        run: flutter pub get

      - name: Generate launcher icons exactly as in installed release build
        run: dart run flutter_launcher_icons

      - name: Publish Shorebird patch
        run: shorebird patch android --release-version "$RELEASE_VERSION" --track "$PATCH_TRACK"
