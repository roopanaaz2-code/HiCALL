name: HiCALL Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hicall-android-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-debug:
    name: Analyze, test, and build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.hicall --project-name hicall .

      - name: Configure Firebase Android SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app
          cp firebase/google-services.json android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path
          settings = Path("android/settings.gradle.kts")
          s = settings.read_text()
          marker = 'id("com.google.gms.google-services") version "4.4.4" apply false'
          if marker not in s:
              s = s.replace("plugins {", "plugins {\n    " + marker, 1)
          settings.write_text(s)
          app = Path("android/app/build.gradle.kts")
          a = app.read_text()
          plugin = 'id("com.google.gms.google-services")'
          if plugin not in a:
              a = a.replace("plugins {", "plugins {\n    " + plugin, 1)
          app.write_text(a)
          PY

      - name: Add Android calling and notification permissions and SDK floor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET"/>',
              '    <uses-permission android:name="android.permission.RECORD_AUDIO"/>',
              '    <uses-permission android:name="android.permission.CAMERA"/>',
              '    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>',
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>',
              '    <uses-permission android:name="android.permission.WAKE_LOCK"/>',
              '    <uses-feature android:name="android.hardware.camera" android:required="false"/>',
              '    <uses-feature android:name="android.hardware.microphone" android:required="false"/>',
          ]
          for item in permissions:
              if item not in s:
                  s = s.replace("<application", item + "\n    <application", 1)
          s = s.replace('android:label="hicall"', 'android:label="HiCALL"')
          deep_link = """            <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="hicall" android:host="auth-callback" />
                      </intent-filter>"""
          if 'android:scheme="hicall"' not in s:
              s = s.replace("</activity>", deep_link + "\n        </activity>", 1)
          p.write_text(s)
          gradle = Path("android/app/build.gradle.kts")
          if gradle.exists():
              g = gradle.read_text().replace("minSdk = flutter.minSdkVersion", "minSdk = 23")
              gradle.write_text(g)
          PY

      - name: Render launcher icon source
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rsvg-convert --width 1024 --height 1024 assets/hicall_icon.svg > assets/hicall_icon.png

      - name: Resolve packages and generate launcher icons
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Apply Dart quick fixes and format
        run: |
          dart fix --apply
          dart format lib test

      - name: Static analysis
        run: flutter analyze --fatal-infos

      - name: Unit tests
        run: flutter test --no-pub

      - name: Build debug APK
        run: flutter build apk --debug --no-pub

      - name: Build release APK
        run: flutter build apk --release --no-pub

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: HiCALL-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HiCALL-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
