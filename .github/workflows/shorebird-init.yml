name: HiCALL Shorebird Initialization

on:
  workflow_dispatch:
    inputs:
      organization_id:
        description: Optional Shorebird organization ID (only needed if your account belongs to multiple organizations)
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: hicall-shorebird-initialization
  cancel-in-progress: false

jobs:
  initialize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      ORGANIZATION_ID: ${{ inputs.organization_id }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify setup
        run: |
          test -n "$SHOREBIRD_TOKEN" || { echo "::error::Add repository secret SHOREBIRD_TOKEN first."; exit 1; }
          test ! -s shorebird.yaml || { echo "::error::shorebird.yaml already exists; initialization is already complete."; exit 1; }

      - name: Set up Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Create the HiCALL Shorebird app configuration
        run: |
          set -euo pipefail
          if [[ -n "$ORGANIZATION_ID" ]]; then
            shorebird init --display-name "HiCALL" --organization-id "$ORGANIZATION_ID"
          else
            shorebird init --display-name "HiCALL"
          fi
          test -s shorebird.yaml
          grep -Eq '^app_id: [0-9a-fA-F-]{36}$' shorebird.yaml

      - name: Commit generated configuration to a review branch
        run: |
          set -euo pipefail
          BRANCH="chore/shorebird-init-${GITHUB_RUN_NUMBER}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add shorebird.yaml pubspec.yaml
          git commit -m "Initialize Shorebird Code Push for HiCALL"
          git push origin "$BRANCH"
          gh pr create             --repo "$GITHUB_REPOSITORY"             --base main             --head "$BRANCH"             --title "Initialize Shorebird Code Push for HiCALL"             --body "Adds the Shorebird app ID generated by the authenticated Shorebird CLI and includes shorebird.yaml in Flutter assets. Review and merge this PR before running the initial release workflow."
